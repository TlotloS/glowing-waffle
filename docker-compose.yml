# Runs the whole system: SQL Server, RabbitMQ, the API and the consumer.
#   docker compose up -d --build
# Swagger UI: http://localhost:5000/swagger
# To run only SQL Server and RabbitMQ (and the apps from your IDE):
#   docker compose up -d sqlserver rabbitmq
# The passwords below are for local development only.

name: ot-assessment

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ot-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-OtAssessment_Dev1}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -C -S 127.0.0.1 -U sa -P "$${MSSQL_SA_PASSWORD}" -Q "SELECT 1" -b -l 3 -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Runs once: creates the database from DatabaseGenerate.sql if it doesn't exist yet, then exits.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ot-db-init
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-OtAssessment_Dev1}"
    volumes:
      - ./DatabaseGenerate.sql:/scripts/DatabaseGenerate.sql:ro
      - ./docker/db-init.sh:/scripts/db-init.sh:ro
    entrypoint: ["/bin/bash", "/scripts/db-init.sh"]
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  rabbitmq:
    image: rabbitmq:4.1-management
    container_name: ot-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "guest"
      RABBITMQ_DEFAULT_PASS: "guest"
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI: http://localhost:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: src/OT.Assessment.Api/Dockerfile
    container_name: ot-api
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__OT_Assessment_DB: "Server=sqlserver,1433;Database=OT_Assessment_DB;User Id=sa;Password=${MSSQL_SA_PASSWORD:-OtAssessment_Dev1};TrustServerCertificate=True;"
      RabbitMq__HostName: "rabbitmq"
    ports:
      - "5000:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  consumer:
    build:
      context: .
      dockerfile: src/OT.Assessment.Consumer/Dockerfile
    container_name: ot-consumer
    environment:
      DOTNET_ENVIRONMENT: "Development"
      ConnectionStrings__OT_Assessment_DB: "Server=sqlserver,1433;Database=OT_Assessment_DB;User Id=sa;Password=${MSSQL_SA_PASSWORD:-OtAssessment_Dev1};TrustServerCertificate=True;"
      RabbitMq__HostName: "rabbitmq"
    depends_on:
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqlserver-data:
  rabbitmq-data:
